<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sephora Lens™</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#9333ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://picsum.photos/seed/sephora-lens-192/192/192">
  <script src="https://cdn.tailwindcss.com"></script>
    <style>
    /* Custom scrollbar for a sleeker look */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    
    /* Sephora Lens Highlight Animation */
    @keyframes lens-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    
    @keyframes sparkle-pulse {
      0%, 100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 1px rgba(147, 51, 234, 0.5)); }
      50% { transform: scale(1.3); opacity: 0.8; filter: drop-shadow(0 0 3px rgba(147, 51, 234, 0.8)); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .lens-highlight {
      border-bottom: 2px dashed #9333ea;
      cursor: help;
      position: relative;
      transition: all 0.3s ease;
      background: linear-gradient(90deg, transparent, rgba(147, 51, 234, 0.05), rgba(147, 51, 234, 0.1), rgba(147, 51, 234, 0.05), transparent);
      background-size: 200% 100%;
      animation: lens-shimmer 4s infinite linear;
      padding: 0 2px;
      border-radius: 2px;
    }

    .lens-highlight:hover {
      background-color: rgba(147, 51, 234, 0.15);
      border-bottom-style: solid;
      background-image: none;
      animation: none;
    }

    .lens-highlight svg {
      animation: sparkle-pulse 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-white text-black font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
